<!DOCTYPE html>

<body>

    <div id="welcome-screen">
        <div class="welcome-oval">
            <svg class="welcome-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <h1 class="click-text">click to enter</h1>

                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23a559" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                ready
            </div>
        </div>
    </div>

    <div id="particles"></div>

    <audio id="bg-music" loop>
        <source src="night-dancer.mp3" type="audio/mpeg">
    </audio>

        <div class="status-pill">
            <i class="fa-solid fa-clock"></i>
            <span id="live-clock-text">00:00:00</span>

        <div class="avatar-wrapper">
            <img src="https://cdn-icons-png.flaticon.com/512/6941/6941697.png" class="crown" alt="Crown">

        </div>

        <p class="bio">Developer 👑 / Designer 💻 / Gamer 🎮</p>

        <div class="social-links">
            <a href="https://github.com/KarosDepZai" class="btn github"><i class="fa-brands fa-github"></i> GitHub</a>
            <a href="https://vm.tiktok.com/ZS9j8xrptUHLc-bCAev/" class="btn tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</a>
