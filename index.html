<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Karos</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRj5lKCxqHroG0nhOU146nCJ6XQobzZBHjp5Z7A8TU&s=0" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen">
        <h1 class="glow-text">Welcome to My Profile</h1>
        <p>[ Click To Enter ]</p>
    </div>

    <div id="particles"></div>

    <div class="profile-container" id="main-content">
        
        <div id="live-clock">00:00:00</div>

        <div class="avatar-wrapper">
            <img src="https://cdn-icons-png.flaticon.com/512/6941/6941697.png" class="crown" alt="Crown">
            <div class="avatar">
                <img src="https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyOG1kNGpqcWtuOHY3ZHkzZ2xjeHowdXY5YnhrdHhpendnOXlkdTMybiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/noKPfoiakFXsk/giphy.gif" alt="Avatar" class="avatar-img">
            </div>
        </div>
        
        <h2 class="name">ᖽᐸａ𝑅Ｏ𝕊?<span class="badge">🔥</span></h2>
        <p class="bio">Developer 👑 / Designer 💻 / Gamer 🎮</p>

        <div class="social-links">
            <a href="https://github.com/KarosDepZai" class="btn github"><i class="fa-brands fa-github"></i> GitHub</a>
            <a href="https://vm.tiktok.com/ZS9j8xrptUHLc-bCAev/" class="btn tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</a>
            <a href="https://discord.gg/Gju793PgHT" class="btn discord"><i class="fa-brands fa-discord"></i> Discord</a>
            <a href="https://www.facebook.com/profile.php?id=61566035506169" class="btn facebook"><i class="fa-brands fa-facebook"></i> Facebook</a>
        </div>

        <div class="music-player">
            <div class="track-info">
                <div class="track-disk" id="track-disk"></div>
                <div class="track-details">
                    <h3 id="track-title"></h3>
                    <p id="track-artist"></p>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="track-time">
                        <span id="current-time">0:00</span>
                        <span id="total-duration">0:00</span>
                    </div>
                </div>
            </div>
            <div class="music-controls">
                <button id="prev-btn" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="play-btn" class="control-btn play-main"><i class="fa-solid fa-play"></i></button>
                <button id="next-btn" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 Designed by Karos.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
